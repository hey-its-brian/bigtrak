; bigtrak drive board: ESP32 DevKit V1 (30-pin, WROOM-32)
; Motors (TB6612FNG), Bluetooth gamepad, encoders, photon cannon, battery
; sense, UART link to the CYD.
;
; Classic ESP32 only. The S3/C3/C6 parts have no Bluetooth Classic and most
; gamepads won't pair with them. See docs/SPEC.md.
;
; Bluepad32 needs BTstack, which the stock Arduino core doesn't ship. So this
; is an ESP-IDF project with Arduino as a component, laid out like Ricardo
; Quesada's esp-idf-arduino-bluepad32-template. The arduino, bluepad32 and
; btstack components are not checked in; fetch them once with:
;
;   ./tools/fetch_components.sh
;
; Platform 55.03.312 = ESP-IDF 5.5.5 + Arduino core 3.3.12. The first build
; can take several minutes.

[platformio]
src_dir = main

[env:drive]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = espidf
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
    esp32_exception_decoder
    time
; The Arduino component's own dependencies (RainMaker, Insights) embed these
; certificates. Nothing here uses them, but the build fails without the lines.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

; Host-side unit tests for the hardware-free logic (stick mixing, battery
; thresholds, line parsing):  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I main
