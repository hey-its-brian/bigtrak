; bigtrak drive board — ESP32 DevKit V1 (30-pin, WROOM-32)
; Motors (TB6612FNG), encoders, photon cannon, battery sense, UART link to the CYD.
;
; Classic ESP32 only — the S3/C3/C6 parts have no Bluetooth Classic and most
; gamepads won't pair with them. See docs/SPEC.md.
;
; Milestone 2 (Bluepad32 gamepad) needs a different Arduino core build. When we
; get there, swap the platform line for Ricardo Quesada's fork, which ships the
; BTstack-enabled core:
;   platform = https://github.com/ricardoquesada/platform-espressif32.git
; Everything else in this file stays as-is.

[env:drive]
platform = espressif32@6.9.0      ; Arduino core 2.0.17 — classic ledcSetup/ledcAttachPin API
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

monitor_filters =
    esp32_exception_decoder
    time

build_flags =
    -D CORE_DEBUG_LEVEL=1
