; bigtrak UI board: ESP32-3248S035C ("CYD" 3.5", capacitive)
; ST7796 480x320 display over SPI, GT911 touch over I2C, classic WROOM-32,
; no PSRAM. Draws the Big Trak keypad, builds programs, talks to the drive
; board over the UART protocol in docs/SPEC.md.
;
; Milestone 3: standalone. Protocol lines go to USB serial, and status lines
; typed into the monitor (STEP 2, BATT 11.8, ...) drive the display.
;
;   pio run                  build the firmware
;   pio run -t upload        flash it
;   pio device monitor       talk to it
;   pio test -e native       run the program/protocol unit tests on the host

[platformio]
default_envs = ui

[env:ui]
platform = espressif32@6.9.0      ; Arduino core 2.0.17, same as drive/
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; LovyanGFX has no autodetect entry for the 3248S035, so the panel, bus,
; backlight and touch are configured by hand in include/display.h.
lib_deps =
    lovyan03/LovyanGFX@1.2.32

monitor_filters =
    esp32_exception_decoder
    time

; "send on enter" so lines typed into the monitor arrive with a newline.
monitor_echo = yes
monitor_eol = LF

build_flags =
    -D CORE_DEBUG_LEVEL=1

; Host-side unit tests for the pure C++ in lib/program (no Arduino, no
; display). Needs a host compiler (clang from the Xcode command line tools).
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
